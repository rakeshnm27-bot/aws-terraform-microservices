server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/learning-paths {
        proxy_pass http://learning-service:5001/api/learning-paths;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/progress {
        proxy_pass http://progress-service:5002/api/progress;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health/learning {
        proxy_pass http://learning-service:5001/health;
    }

    location /health/progress {
        proxy_pass http://progress-service:5002/health;
    }
}
